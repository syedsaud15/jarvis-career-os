server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "JARVIS Private Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 5m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/health;
    }
    location = /demo {
        auth_basic off;
        # Serve the SPA file in this location; do not redirect to protected /index.html.
        try_files /index.html =404;
    }
    location ^~ /demo/ {
        auth_basic off;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        auth_basic off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /favicon.svg { auth_basic off; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header X-API-Key "__JARVIS_API_KEY__";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
