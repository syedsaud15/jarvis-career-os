name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://jarvis_test:test_only_password@localhost:5432/jarvis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: dashboard/playwright-report/

  production-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag jarvis-career-os:ci .
      - name: Start isolated production container
        run: docker run -d --name jarvis-access-test -p 10000:10000 -e JARVIS_ADMIN_USER=ci-only -e JARVIS_ADMIN_PASSWORD=ci-only-test-password -e JARVIS_API_KEY=ci-only-api-key jarvis-career-os:ci
      - name: Verify public demo and private authentication boundary
        run: python scripts/check_access_boundary.py http://localhost:10000
      - name: Stop test container
        if: always()
        run: docker rm -f jarvis-access-test || true
