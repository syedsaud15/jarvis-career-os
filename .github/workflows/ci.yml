name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  production-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag jarvis-career-os:ci .
      - name: Start isolated production container
        run: docker run -d --name jarvis-access-test -p 10000:10000 -e JARVIS_ADMIN_USER=ci-only -e JARVIS_ADMIN_PASSWORD=ci-only-test-password -e JARVIS_API_KEY=ci-only-api-key jarvis-career-os:ci
      - name: Verify public demo and private authentication boundary
        run: python scripts/check_access_boundary.py http://localhost:10000
      - name: Stop test container
        if: always()
        run: docker rm -f jarvis-access-test || true
